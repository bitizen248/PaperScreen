; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;--------------- select you board --------------;


;--------------- select a example --------------;
; src_dir = examples/bq25896/main               ;
; src_dir = examples/bq27220/main               ;
; src_dir = examples/display_test/main          ; 
; src_dir = examples/GPS/main                   ;
; src_dir = examples/lora_recv/main             ;
; src_dir = examples/lora_send/main             ;
; src_dir = examples/lvgl_test/main             ;
; src_dir = examples/rtc_pcf8563/main           ;
; src_dir = examples/sd_card/main               ;
; src_dir = examples/touch/main                 ;
; src_dir = examples/io_extend/main             ;
; src_dir = examples/nvs_test                   ;
; src_dir = examples/factory/main               ;
src_dir = src                                  ;

;******************************************************
; Example routines using the FastEPD library
;******************************************************
; src_dir = examples/FastEPD/getting_started    ;
; src_dir = examples/FastEPD/gif_player         ;
; src_dir = examples/FastEPD/grayscale_test     ;
; src_dir = examples/FastEPD/show_jpeg          ;
; src_dir = examples/FastEPD_lvgl_test/main     ;

;----------------------------------------------;
boards_dir = boards
[env:T5_E_PAPER_S3_V7]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
build_type = debug
upload_speed =  921600
monitor_speed = 115200
; monitor_port = COM136
monitor_filters = esp32_exception_decoder

; DEBUG: lets `pio debug` attach GDB over the S3's built-in USB-JTAG (no
; external probe needed) - requires ARDUINO_USB_MODE=1 below. With a
; debugger attached, ESP-IDF halts into GDB on panic instead of just
; rebooting, which sidesteps the USB-reconnect timing gap that swallows
; panic/backtrace text on the plain serial monitor.
debug_tool = esp-builtin
; board_build.partition = default_16MB.csv
; extra_scripts =  ./script/pos_extra_script.py

build_flags = 
    -DBOARD_HAS_PSRAM
    -DPSRAM_SPEED=120MHz
    -DARDUINO_LOOP_STACK_SIZE=32768

    ; Enable -DARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; DEBUG: switch from native USB-OTG CDC (TinyUSB) to the S3's Hardware
    ; CDC-and-JTAG peripheral. The board json hardcodes ARDUINO_USB_MODE=0
    ; (TinyUSB), whose panic/backtrace output is unreliable - the panic
    ; handler runs with interrupts disabled and the scheduler halted, which
    ; TinyUSB needs to flush its buffer. HW CDC-and-JTAG is a plain hardware
    ; FIFO peripheral on the same USB-C port/pins, so panics print reliably
    ; and it also enables OpenOCD/GDB debugging over the same cable.
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=1

    -DCORE_DEBUG_LEVEL=5

    ; -DLOG_PORT=Serial

    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; diy-esp32-epub-reader submodule: avoid miniz/zlib symbol collisions
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES

    -Wl,--gc-sections

    ; Optional: set the TRMNL cloud API key for BYOD builds.
    ; Key is read from the environment so it never lands in source control.
    ; Set it before building, e.g.  source ./trmnl_key.local.sh  (gitignored), or
    ; export PAPER_SCREEN_TRMNL_API_KEY=your_key
     -DPAPER_SCREEN_TRMNL_API_KEY=\"${sysenv.PAPER_SCREEN_TRMNL_API_KEY}\"

lib_extra_dirs =
    lib/diy-esp32-epub-reader/lib

lib_deps =
    ; lvgl/lvgl@8.4.0
    ; lewisxhe/SensorLib@0.2.2
    ; lewisxhe/XPowersLib@^0.2.7
    Wire
    SPI
    SD
    https://github.com/leethomason/tinyxml2.git
    https://github.com/bitbank2/PNGdec.git
